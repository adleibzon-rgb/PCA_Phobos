# xcodegen spec: `xcodegen generate` -> PCAPhobos.xcodeproj
# Signing: set DEVELOPMENT_TEAM (paid Apple Developer account — Network Extension needs it).
name: PCAPhobos
options:
  bundleIdPrefix: com.bobyrev
  deploymentTarget:
    iOS: "16.0"
packages:
  WireGuardKit:
    path: WireGuardKit
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: Q5FKU39TUA
    CODE_SIGN_STYLE: Automatic
targets:
  PCAPhobos:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    resources:
      - App/Assets.xcassets
    dependencies:
      - target: PhobosTunnel
    entitlements:
      path: App/PCAPhobos.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PCA Phobos
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        CFBundleURLTypes:
          - CFBundleURLName: com.bobyrev.pcaphobos.link
            CFBundleURLSchemes: [phobos]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bobyrev.pcaphobos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PhobosTunnel:
    type: app-extension
    platform: iOS
    sources:
      - Tunnel/PacketTunnelProvider.swift
      - Tunnel/TunnelConfiguration+WgQuickConfig.swift
      - Tunnel/String+ArrayConversion.swift
      - Tunnel/pcarelay.c
      - Tunnel/WsLink.swift
      - Shared
      - path: Tunnel/ru_bypass.txt
        buildPhase: resources
      - path: Tunnel/obfuscator
        compilerFlags: ["-Dmain=wgobf_main", "-w"]
        excludes: ["*.h"]
    dependencies:
      - package: WireGuardKit
    entitlements:
      path: Tunnel/PhobosTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: PhobosTunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bobyrev.pcaphobos.tunnel
        SWIFT_OBJC_BRIDGING_HEADER: Tunnel/Tunnel-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(PROJECT_DIR)/Tunnel", "$(PROJECT_DIR)/Tunnel/obfuscator"]
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": ["$(PROJECT_DIR)/WireGuardGo/iphoneos"]
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": ["$(PROJECT_DIR)/WireGuardGo/iphonesimulator"]
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
